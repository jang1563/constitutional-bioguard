services:
  bioguard:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./models/deberta_bioguard_v1:/models/deberta_bioguard_v1:ro
    environment:
      - BIOGUARD_MODEL_DIR=/models/deberta_bioguard_v1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
